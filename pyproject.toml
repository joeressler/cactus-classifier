[project]
name = "cactus-classifier"
version = "0.1.0"
description = "Configurable image classification training for Trichocereus cacti and lookalikes"
readme = "README.md"
authors = [
    { name = "Joseph Ressler", email = "joe.a.ressler@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "Pillow>=10.0",
    "scikit-learn>=1.5",
    "requests>=2.31",
]

[project.scripts]
cactus-train = "cactus_classifier.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
